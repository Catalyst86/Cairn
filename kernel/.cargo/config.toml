# Kernel build configuration for the custom Cairn none target.
# This enables building core/alloc without a host OS.

[build]
target = "x86_64-cairn-none.json"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-cairn-none]
rustflags = [
    "-C", "force-frame-pointers=yes",
]
