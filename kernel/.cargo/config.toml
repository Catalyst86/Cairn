# Kernel build configuration.
# We use the built-in bare-metal target x86_64-unknown-none (red-zone disabled,
# SSE off / soft-float) and configure the higher-half kernel specifics — kernel
# code model, static relocation, and the Limine linker script — via rustflags.
# This avoids maintaining a custom .json target spec (whose format keeps changing).

[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=-Tlinker.ld",
]
